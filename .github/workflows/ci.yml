name: CI - Security & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore MySecureApp.sln

    - name: Build
      run: dotnet build MySecureApp.sln --configuration Release --no-restore

    - name: SonarQube Scan
      if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet sonarscanner begin /k:"MySecureApp" /o:"my-org" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN"
        dotnet build MySecureApp.sln --configuration Release --no-restore
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: Check vulnerable packages
      run: dotnet list package --vulnerable --include-transitive || true

    - name: Check for secrets
      uses: zricethezav/gitleaks-action@v1
